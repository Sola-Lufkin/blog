<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Space Bowling — Sola Lufkin</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./assets/css/normalize.css">
  <link rel="stylesheet" href="./assets/css/cyberpunk.css">

  <!-- Game CSS overrides -->
  <style>
    body { background: var(--bg); overflow-x: hidden; }
    canvas { background: #050510; }
  </style>

  <script type="text/javascript" src="./assets/js/vendor/jquery.js"></script>
  <script type="text/javascript" src="./assets/js/game.js"></script>
</head>
<body>

  <!-- Nav -->
  <nav class="podcast-nav">
    <a href="./index.html">&gt;_ SOLA.LUFKIN</a>
  </nav>

  <div id="game-wrap">

    <div id="game-header">
      <h1>// SPACE BOWLING</h1>
      <p>$ click asteroids to destroy them. good luck.</p>
    </div>

    <div id="game">
      <div id="gameUI">
        <div id="gameIntro">
          <h1>READY?</h1>
          <p>Destroy all the asteroids.</p>
          <p><a href=" " id="gamePlay" class="button">[▶] Play</a></p>
        </div>

        <div id="gameStats">
          <p>Asteroids: <span id="gameRemaining"></span></p>
          <p>Clicks: <span class="gameScore"></span></p>
          <p><a href=" " class="gameReset">[↺] Reset</a></p>
        </div>

        <div id="gameComplete">
          <h1>YOU WIN!</h1>
          <p>Completed in <span class="gameScore"></span> clicks.</p>
          <p><a href=" " class="gameReset button">[▶] Play again</a></p>
        </div>
      </div>

      <canvas id="gameCanvas" width="350" height="600"></canvas>
    </div>

  </div><!-- /#game-wrap -->

  <script src="./assets/js/mobile-fx.js"></script>

</body>
</html>
